<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patchbay</title>
<meta name="description" content="Offenes Protokoll für Web-Kreativ-Tools: Bilder mit kompletter Historie in einem Node-Editor verkabeln.">
<meta name="theme-color" content="#F4F4F4">
<script>
/* Gespeichertes Theme vor dem ersten Zeichnen setzen, damit nichts aufblitzt */
try { var t = localStorage.getItem('patchbay.theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch(e){}
</script>
<link rel="icon" type="image/svg+xml" href="/assets/patchbay-icon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,700..900&family=Geist:wght@400&family=Geist+Mono:wght@400&display=swap">
<style>
/* Layout: Leinwand mit Punktraster über die ganze Fläche. Schwebende Bedienelemente: Marke oben links, Status oben rechts,
   Werkzeugschiene links, Zoom unten links, Paket-Knopf unten rechts, Ausgabe als schwebende Karte rechts. Monochrom. */
:root {
  --canvas: #F4F4F4;
  --dot: #D2D2D2;
  --card: #EFEFEF;
  --card-edge: #E4E4E4;
  --raised: #FFFFFF;
  --raised-edge: #E6E6E6;
  --inset: #F3F3F3;
  --chip: #E9E9E9;
  --ink: #1C1C1C;
  --ink-2: #4B4B4B;
  --muted: #8C8C8C;
  --line: #E3E3E3;
  --wire: #B4B4B4;
  --wire-strong: #1F1F1F;
  --solid: #1F1F1F;
  --solid-ink: #FFFFFF;
  --accent: #1F1F1F;
  --accent-soft: #E7E7E7;
  --note: #FAF5E1;
  --note-edge: #EDE2B8;
  --note-ink: #4A4224;
  --good: #2F8A57;
  --warn: #A06A00;
  --bad: #C2402F;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 18px -10px rgba(0,0,0,.18);
  --shadow-up: 0 2px 4px rgba(0,0,0,.06), 0 18px 36px -14px rgba(0,0,0,.28);
  --cable-1: #C99700; --cable-2: #23845A; --cable-3: #C63B2B; --cable-4: #7A3FB0;
  --font: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: var(--font); --font-display: var(--display); --font-mono: var(--mono);
  --bg: var(--canvas); --panel: var(--inset);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #121212; --dot: #2B2B2B; --card: #1B1B1B; --card-edge: #262626; --raised: #1F1F1F; --raised-edge: #2C2C2C; --inset: #262626; --chip: #2E2E2E;
    --ink: #EDEDED; --ink-2: #BDBDBD; --muted: #8A8A8A; --line: #2C2C2C; --wire: #4A4A4A; --wire-strong: #EDEDED;
    --solid: #EDEDED; --solid-ink: #141414; --accent: #EDEDED; --accent-soft: #2E2E2E;
    --note: #2A2618; --note-edge: #3E3720; --note-ink: #E9DDAF; --good: #5BC28A; --warn: #E0A43A; --bad: #E8644F;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7); --shadow-up: 0 2px 4px rgba(0,0,0,.5), 0 22px 40px -14px rgba(0,0,0,.8);
    --cable-1: #EDBE2C; --cable-2: #48B583; --cable-3: #E8644F; --cable-4: #AE7BDD;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #121212; --dot: #2B2B2B; --card: #1B1B1B; --card-edge: #262626; --raised: #1F1F1F; --raised-edge: #2C2C2C; --inset: #262626; --chip: #2E2E2E;
  --ink: #EDEDED; --ink-2: #BDBDBD; --muted: #8A8A8A; --line: #2C2C2C; --wire: #4A4A4A; --wire-strong: #EDEDED;
  --solid: #EDEDED; --solid-ink: #141414; --accent: #EDEDED; --accent-soft: #2E2E2E;
  --note: #2A2618; --note-edge: #3E3720; --note-ink: #E9DDAF; --good: #5BC28A; --warn: #E0A43A; --bad: #E8644F;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7); --shadow-up: 0 2px 4px rgba(0,0,0,.5), 0 22px 40px -14px rgba(0,0,0,.8);
  --cable-1: #EDBE2C; --cable-2: #48B583; --cable-3: #E8644F; --cable-4: #AE7BDD;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; overflow: hidden; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible, [contenteditable]:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 18px; height: 18px; flex: none; }

/* Gerüst */
.app { position: fixed; inset: 0; }
.board { position: absolute; inset: 0; overflow: auto; background-color: var(--canvas); background-image: radial-gradient(var(--dot) 1.1px, transparent 1.4px); background-size: 22px 22px; overscroll-behavior: contain; scrollbar-width: thin; }
.board.panning { cursor: grabbing; }
.sizer { position: relative; }
.plane { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.wires, .ink { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.ink { z-index: 100000; }
.penlayer { position: absolute; inset: 0; z-index: 100001; cursor: crosshair; touch-action: none; }
.wire { fill: none; stroke: var(--wire); stroke-width: 1.6; stroke-linecap: round; pointer-events: none; transition: stroke .12s, stroke-width .12s; }
.wire.temp { stroke: var(--wire-strong); stroke-dasharray: 5 5; stroke-width: 1.6; }
.wire-hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: pointer; }
.wire-hit:hover + .wire { stroke: var(--wire-strong); stroke-width: 2.2; }
.ink-stroke { fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* Schwebende Bedienelemente */
.float { position: absolute; z-index: 20; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px 0 6px; background: var(--raised); border: 1px solid var(--raised-edge); border-radius: 999px; box-shadow: var(--shadow); color: var(--ink); font: 600 13px/1 var(--font); }
.brand { left: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); }
.brand > button { cursor: pointer; }
.logo { width: 28px; height: 28px; border-radius: 50%; background: var(--solid); color: var(--solid-ink); display: grid; place-items: center; flex: none; }
.logo svg { width: 18px; height: 10px; display: block; }
.status { right: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); }
.status .pill { padding: 0 14px; font-weight: 500; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 20%, transparent); flex: none; }
.sdot.idle { background: var(--muted); box-shadow: none; }
.sdot.busy { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 20%, transparent); }

.rail { left: 16px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px; background: var(--raised); border: 1px solid var(--raised-edge); border-radius: 26px; box-shadow: var(--shadow); }
.rbtn { position: relative; width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); cursor: pointer; }
.rbtn:hover { background: var(--inset); color: var(--ink); }
.rbtn[aria-pressed="true"], .rbtn[aria-expanded="true"] { background: var(--chip); color: var(--ink); }
.rbtn.big { width: 40px; height: 40px; border-radius: 50%; background: var(--solid); color: var(--solid-ink); margin-bottom: 4px; }
.rbtn.big:hover, .rbtn.big[aria-expanded="true"] { background: var(--solid); color: var(--solid-ink); opacity: .88; }
.rsep { width: 20px; height: 1px; background: var(--line); margin: 4px 0; }
[data-tip]:not([aria-expanded="true"]):hover::after { content: attr(data-tip); position: absolute; left: calc(100% + 12px); top: 50%; transform: translateY(-50%); white-space: nowrap; background: var(--solid); color: var(--solid-ink); font: 500 12px/1 var(--font); padding: 7px 9px; border-radius: 7px; pointer-events: none; z-index: 5; }
.bulb-on, .bulb-off { display: none; }
:root[data-theme="dark"] .bulb-off, :root:not([data-theme]) .bulb-on, :root[data-theme="light"] .bulb-on { display: block; }
@media (prefers-color-scheme: dark) { :root:not([data-theme]) .bulb-on { display: none; } :root:not([data-theme]) .bulb-off { display: block; } }

.zoom { left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; align-items: center; }
.zoompill { display: flex; align-items: center; height: 36px; padding: 0 4px; background: var(--raised); border: 1px solid var(--raised-edge); border-radius: 10px; box-shadow: var(--shadow); }
.zbtn { width: 28px; height: 28px; display: grid; place-items: center; border: 0; background: transparent; color: var(--ink-2); border-radius: 7px; cursor: pointer; font: 500 16px/1 var(--font); }
.zbtn:hover { background: var(--inset); color: var(--ink); }
.zoomval { min-width: 52px; font: 500 12px/1 var(--mono); color: var(--ink-2); background: transparent; border: 0; height: 28px; border-radius: 7px; cursor: pointer; font-variant-numeric: tabular-nums; }
.zoomval:hover { background: var(--inset); color: var(--ink); }
.sqbtn { width: 36px; height: 36px; display: grid; place-items: center; background: var(--raised); border: 1px solid var(--raised-edge); border-radius: 10px; box-shadow: var(--shadow); color: var(--ink-2); cursor: pointer; font: 600 15px/1 var(--font); }
.sqbtn:hover, .sqbtn[aria-expanded="true"] { color: var(--ink); background: var(--inset); }
.fab { right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--raised); border: 1px solid var(--raised-edge); box-shadow: var(--shadow); color: var(--ink); cursor: pointer; }
.fab[aria-pressed="true"] { background: var(--solid); color: var(--solid-ink); border-color: var(--solid); }

.pop { position: absolute; background: var(--raised); border: 1px solid var(--raised-edge); border-radius: 14px; box-shadow: var(--shadow-up); padding: 8px; z-index: 30; }
.kbdpop { left: 0; bottom: calc(100% + 10px); width: 260px; display: grid; gap: 2px; font-size: 13px; }
.kbdpop div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 8px; color: var(--ink-2); }
.kbdpop kbd { font: 500 11px/1 var(--mono); background: var(--inset); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; color: var(--ink); white-space: nowrap; }

.menuwrap, .penwrap { position: relative; }
.menu { left: calc(100% + 16px); top: -8px; width: 300px; max-height: min(78vh, 600px); overflow: auto; display: grid; gap: 1px; }
.brand .menu { left: 0; top: calc(100% + 8px); width: 260px; }
.menu h4 { margin: 10px 8px 4px; font: 500 11px/1 var(--font); letter-spacing: .02em; color: var(--muted); }
.menu > button, .menu a.mi { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 0 10px; align-items: center; text-align: left; font: 500 13px/1.3 var(--font); color: var(--ink); background: transparent; border: 0; padding: 7px 8px; border-radius: 8px; cursor: pointer; text-decoration: none; }
.menu > button:hover, .menu a.mi:hover { background: var(--inset); }
.menu > button small { grid-column: 2; font-weight: 400; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.menu > button.plain, .menu a.mi { grid-template-columns: minmax(0, 1fr); }
.menu .av { grid-row: span 2; }
.menu .jack { width: 10px; height: 10px; border-radius: 50%; background: var(--c); justify-self: center; grid-row: span 2; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; width: auto; }
.menu form { display: grid; gap: 6px; padding: 4px 8px 8px; }
.menu label.fl { font-size: 12px; color: var(--muted); }
.menu input[type="url"] { font: 12px/1.3 var(--mono); padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--inset); color: var(--ink); width: 100%; min-width: 0; }
.menu .err { font-size: 12px; color: var(--bad); margin: 0; }
.menu form .btn { justify-self: start; }
.flyout { left: calc(100% + 16px); top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 12px; }
.swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--raised); box-shadow: 0 0 0 1px var(--line); background: var(--sw); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }

.btn { font: 500 12px/1 var(--font); border: 1px solid var(--line); background: var(--raised); color: var(--ink); padding: 8px 11px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
.btn:hover { background: var(--inset); }
.btn.solid { background: var(--solid); color: var(--solid-ink); border-color: var(--solid); border-radius: 999px; padding: 8px 13px; font-weight: 600; }
.btn.solid:hover { opacity: .88; }

/* Nodes */
.node { position: absolute; display: grid; gap: 6px; align-content: start; }
.nlabel { display: flex; align-items: center; gap: 6px; height: 18px; padding: 0 2px; color: var(--muted); font: 500 12px/1 var(--font); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; white-space: nowrap; }
.nlabel svg { width: 13px; height: 13px; }
.nlabel .sp { flex: 1; }
.nlabel .delbtn { opacity: 0; }
.node:hover .nlabel .delbtn, .node:focus-within .nlabel .delbtn { opacity: 1; }
.node.dragging .nlabel { cursor: grabbing; }
.card { position: relative; background: var(--card); border: 1px solid var(--card-edge); border-radius: 14px; padding: 12px; display: grid; gap: 10px; align-content: start; }
.card.raised { background: var(--raised); border-color: var(--raised-edge); box-shadow: var(--shadow); }
.node.dragging .card { box-shadow: var(--shadow-up); }
.chead { display: flex; align-items: center; gap: 10px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; min-height: 36px; }
.node.dragging .chead { cursor: grabbing; }
.av { position: relative; width: 34px; height: 34px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font: 600 14px/1 var(--font); color: var(--ink-2); flex: none; }
.av::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; background: var(--c); border: 2px solid var(--raised); }
.ctitle { flex: 1; min-width: 0; display: grid; gap: 2px; }
.ctitle b { font: 600 15px/1.2 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctitle small { font-size: 12px; color: var(--muted); line-height: 1.3; }
.vbadge { font: 500 10px/1 var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 3px 5px; flex: none; text-transform: uppercase; }
.delbtn { font: 500 15px/1 var(--font); border: 0; background: transparent; color: var(--muted); width: 22px; height: 22px; border-radius: 6px; cursor: pointer; flex: none; padding: 0; }
.delbtn:hover { background: var(--chip); color: var(--ink); }
.thumb { width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 10px; background: var(--inset); display: block; }
.ppanel { background: var(--inset); border-radius: 10px; padding: 10px; display: grid; gap: 10px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.field label output { font-family: var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.field.row { grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px; }
.field.row > :last-child { justify-self: end; }
.field input[type="range"] { width: 100%; accent-color: var(--ink); margin: 0; }
.field select, .field input[type="text"], .field input[type="number"] { font: 13px/1.3 var(--font); padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--raised); color: var(--ink); min-width: 0; }
.field input[type="text"] { width: 100%; }
.field.row select { max-width: 150px; }
.field input[type="color"] { width: 54px; height: 26px; border: 1px solid var(--line); border-radius: 7px; background: var(--raised); padding: 2px; cursor: pointer; }
.seedrow { display: flex; gap: 6px; }
.seedrow input { width: 92px; }
.switch-input { appearance: none; -webkit-appearance: none; width: 30px; height: 18px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
.switch-input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--raised); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch-input:checked { background: var(--solid); border-color: var(--solid); }
.switch-input:checked::after { transform: translateX(12px); background: var(--solid-ink); }
.cfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.cfoot .tg { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.status-t { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.status-t.cache { color: var(--warn); }
.status-t.live { color: var(--good); }
.node.bypass .ppanel, .node.bypass .thumb { opacity: .45; }
.node.bypass .ppanel { pointer-events: none; }

/* Anschlüsse: Eingang als Pille links, Ausgang als Ring rechts */
.port { touch-action: none; }
.port.in { position: absolute; right: calc(100% + 14px); top: 17px; height: 28px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px 0 5px; background: var(--raised); border: 1px solid var(--raised-edge); border-radius: 999px; box-shadow: var(--shadow); font: 500 12px/1 var(--font); color: var(--ink-2); white-space: nowrap; cursor: crosshair; z-index: 2; }
.port.in .knob { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ink-2); display: grid; place-items: center; }
.port.in .knob::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: transparent; }
.port.in.on { border-color: var(--wire-strong); color: var(--ink); }
.port.in.on .knob { border-color: var(--ink); }
.port.in.on .knob::after { background: var(--ink); }
.board.wiring .port.in { box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
.port.out { position: absolute; right: -8px; top: 22px; width: 16px; height: 16px; border-radius: 50%; background: var(--raised); border: 1.5px solid var(--ink-2); cursor: crosshair; z-index: 2; }
.port.out::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; }
.port.out.on { border-color: var(--ink); }
.port.out:hover, .port.in:hover .knob { transform: scale(1.12); }

.toolui { display: block; width: 100%; height: 360px; border: 0; border-radius: 10px; background: transparent; }
.tag-ext { font: 500 10px/1 var(--mono); text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 3px 5px; flex: none; }

/* Text, Notiz, Brücke */
.node.textnode .card { padding: 16px 18px; gap: 8px; }
.tn-title { margin: 0; font: 650 24px/1.15 var(--font); letter-spacing: -0.01em; text-wrap: balance; }
.tn-body { margin: 0; color: var(--ink-2); font-size: 14px; line-height: 1.6; }
.tn-foot { display: flex; justify-content: flex-end; color: var(--muted); }
.node.note .card { background: var(--note); border-color: var(--note-edge); color: var(--note-ink); }
.note-body { min-height: 90px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
[data-placeholder]:empty::before { content: attr(data-placeholder); opacity: .5; }
.bridge .drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 7px; justify-items: center; text-align: center; font-size: 12px; color: var(--muted); }
.bridge .drop:focus-visible, .bridge .drop.over { border-color: var(--ink); background: var(--inset); color: var(--ink); outline: none; }
.bridge .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.outfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.hash { font: 12px/1.2 var(--mono); color: var(--muted); }

/* Ausgabe-Panel */
.side { position: absolute; z-index: 15; top: calc(66px + env(safe-area-inset-top, 0px)); right: 16px; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); width: 360px; background: var(--raised); border: 1px solid var(--raised-edge); border-radius: 18px; box-shadow: var(--shadow-up); overflow: auto; display: flex; flex-direction: column; gap: 14px; padding: 16px; }
.app.no-side .side { display: none; }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.side-head h2 { margin: 0; font: 600 16px/1.2 var(--font); }
.side-head .tag { font: 500 11px/1 var(--font); color: var(--muted); margin-bottom: 4px; }
#out { width: 100%; max-width: 100%; aspect-ratio: 1; border-radius: 12px; background: var(--inset); display: block; flex: none; }
.meta { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; font-size: 12px; margin: 0; background: var(--inset); border-radius: 10px; padding: 10px 12px; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; overflow-wrap: anywhere; font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.itabs { display: flex; gap: 2px; background: var(--inset); border-radius: 10px; padding: 3px; }
.itabs button { flex: 1; font: 500 12px/1 var(--font); background: transparent; color: var(--muted); border: 0; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.itabs button[aria-selected="true"] { background: var(--raised); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.ipanel { min-width: 0; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-family: var(--mono); font-size: 11.5px; }
.log li { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 8px; padding: 6px 2px; border-bottom: 1px solid var(--line); }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; }
.log .msg { min-width: 0; overflow-wrap: anywhere; color: var(--ink-2); }
.chip { display: inline-block; font: 500 10.5px/1 var(--mono); padding: 3px 6px; border-radius: 5px; background: var(--chip); color: var(--ink); margin-right: 6px; }
.chip.k-result { background: color-mix(in srgb, var(--good) 20%, transparent); }
.chip.k-error { background: color-mix(in srgb, var(--bad) 22%, transparent); }
.chip.k-cache { background: color-mix(in srgb, var(--warn) 22%, transparent); }
.route { color: var(--muted); }
pre.json { font-family: var(--mono); font-size: 11.5px; line-height: 1.55; background: var(--inset); border-radius: 10px; padding: 12px; margin: 0; overflow: auto; white-space: pre; max-height: 50vh; color: var(--ink-2); }
.hist { list-style: none; margin: 0; padding: 0; display: grid; }
.hist li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 10px; position: relative; padding-bottom: 14px; }
.hist li:not(:last-child)::after { content: ""; position: absolute; left: 7px; top: 16px; bottom: 0; width: 1.5px; background: var(--line); }
.hist .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--raised); border: 1.5px solid var(--ink-2); position: relative; }
.hist .dot::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--c); }
.hist .h1 { font-size: 13px; color: var(--ink); }
.hist .h2 { font-family: var(--mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.repro { font: 500 10px/1 var(--mono); padding: 3px 6px; border-radius: 5px; margin-left: 6px; background: var(--chip); vertical-align: 1px; }
.repro.exact { background: color-mix(in srgb, var(--good) 18%, transparent); }
.repro.seeded { background: color-mix(in srgb, var(--warn) 18%, transparent); }
.repro.opaque { background: color-mix(in srgb, var(--bad) 18%, transparent); }
.empty { color: var(--muted); font-size: 13px; margin: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.hidden-frames { position: absolute; width: 1px; height: 1px; overflow: hidden; left: -9999px; top: 0; }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--solid); color: var(--solid-ink); font-size: 13px; padding: 10px 14px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 140px); z-index: 300000; box-shadow: var(--shadow-up); }
.toast.show { opacity: 1; }
body.dragging-any iframe { pointer-events: none; }
body.resizing-any, body.resizing-any * { cursor: nwse-resize !important; }

/* Gast-Nodes: Größe ziehen, Vollbild */
.resize { position: absolute; right: 3px; bottom: 3px; width: 18px; height: 18px; cursor: nwse-resize; touch-action: none; border-radius: 4px; z-index: 3; color: var(--muted); display: grid; place-items: center; }
.resize::before { content: ""; width: 9px; height: 9px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; border-bottom-right-radius: 3px; }
.resize:hover, .node.resizing .resize { color: var(--ink); background: var(--inset); }
.node.resizing .card { box-shadow: 0 0 0 1.5px var(--ink), var(--shadow-up); }
.sizetag { position: absolute; right: 26px; bottom: 6px; font: 400 11px/1 var(--mono); color: var(--muted); background: var(--raised); border: 1px solid var(--line); border-radius: 5px; padding: 3px 5px; pointer-events: none; }
.fsbtn { border: 0; background: transparent; color: var(--muted); width: 22px; height: 22px; border-radius: 6px; cursor: pointer; display: grid; place-items: center; padding: 0; opacity: 0; }
.node:hover .fsbtn, .node:focus-within .fsbtn { opacity: 1; }
.fsbtn:hover { background: var(--chip); color: var(--ink); }
.fsbtn svg { width: 14px; height: 14px; }
.fsov { position: fixed; inset: 0; z-index: 250000; background: color-mix(in srgb, var(--canvas) 92%, transparent); backdrop-filter: blur(6px); display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.fshead { display: flex; align-items: center; gap: 12px; }
.fshead .av { width: 30px; height: 30px; }
.fshead h2 { margin: 0; flex: 1; min-width: 0; }
.fshead .meta-s { font: 400 12px/1 var(--mono); color: var(--muted); }
.fsbody { position: relative; min-height: 0; background: var(--raised); border: 1px solid var(--raised-edge); border-radius: 18px; box-shadow: var(--shadow-up); overflow: hidden; }
.fsbody iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

@media (max-width: 820px) {
  .status { display: none; }
  .rail { top: auto; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); transform: none; }
  .menu { position: fixed; left: 12px; right: 12px; top: auto; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); width: auto; }
  .brand .menu { position: absolute; left: 0; right: auto; top: calc(100% + 8px); bottom: auto; width: 260px; }
  .flyout { left: calc(100% + 10px); }
  .side { left: 0; right: 0; bottom: 0; top: auto; height: 74vh; width: auto; border-radius: 18px 18px 0 0; z-index: 200000; }
  [data-tip]:hover::after { display: none; }
}
@media (prefers-reduced-motion: reduce) { .toast, .wire, .switch-input, .switch-input::after { transition: none; } }

/* Typo-Regel: Copy nur Regular, Unterschiede über Größe und Helligkeit.
   Gewicht nur in Headlines, dort die breite Archivo. Betonung im Text per Unterstreichung. */
.app *, .toast { font-weight: 400 !important; }
.app strong, .app b:not(.hl), .app em, .app .u { font-weight: 400; font-style: normal; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.tn-title, .side-head h2, .fshead h2, .ctitle b, .brand .word { font-family: var(--display); font-stretch: 125%; text-decoration: none; }
.app .tn-title { font-weight: 800 !important; font-size: 30px; line-height: 1.04; letter-spacing: -0.005em; }
.app .side-head h2 { font-weight: 800 !important; font-size: 20px; line-height: 1.1; }
.fshead h2 { font-weight: 800; font-size: 20px; line-height: 1.1; }
.app .ctitle b { font-weight: 700 !important; font-size: 15px; letter-spacing: 0; }
.app .brand .word { font-weight: 800 !important; font-size: 14px; letter-spacing: .01em; }
.btn.solid { letter-spacing: .01em; }
</style>

  <div class="float zoom">

<script type="text/plain" id="tool-css">
:root{--bg:#fff;--panel:#f4f6f7;--raised:#fff;--ink:#14181d;--muted:#56606b;--line:#c6cdd4;--accent:#2343d0;--accent-ink:#fff;--c:#c99700}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--raised);color:var(--ink);font:14px/1.45 var(--font-body,system-ui,sans-serif)}
.app{padding:14px 16px 18px;display:grid;gap:12px;max-width:520px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.jack{width:12px;height:12px;border-radius:50%;background:var(--c)}
h1{font:800 18px/1.1 var(--font-display,system-ui,sans-serif);font-stretch:118%;margin:0}
.ver{font:500 11px/1 var(--font-mono,monospace);color:var(--muted)}
.pb{margin-left:auto;font:400 11px/1 var(--font-mono,monospace);padding:4px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.job{color:var(--muted);font-size:13px;margin-top:-6px}
.stage{position:relative;background:var(--panel);border-radius:8px;overflow:hidden;aspect-ratio:1;max-width:100%}
canvas{display:block;width:100%;height:100%}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);font-size:13px}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.f{display:grid;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
label output{font-family:var(--font-mono,monospace);color:var(--ink)}
input,select{font:13px/1.3 var(--font-body,system-ui,sans-serif);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%;min-width:0}
input[type=range]{padding:0;accent-color:var(--accent);background:transparent;border:0}
input[type=color]{height:32px;padding:2px}
.seed{display:flex;gap:6px}
button{font:400 13px/1 var(--font-body,system-ui,sans-serif);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.send{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.send label{font-size:13px;color:var(--ink)}
.hist{font:12px/1.4 var(--font-mono,monospace);color:var(--muted)}
.hist b{color:var(--ink);font-weight:400;text-decoration:underline;text-underline-offset:3px}
@media (min-width:760px){.app{max-width:1200px;grid-template-columns:minmax(0,1fr) minmax(280px,380px);align-items:start;column-gap:20px}.app>header,.app>.job{grid-column:1/-1}.stage{grid-column:1;grid-row:3/span 4;position:sticky;top:14px;width:min(100%,calc(100vh - 120px));justify-self:center}.app>form,.app>.hist,.app>.send{grid-column:2}form{grid-template-columns:1fr}}
</script>

<script type="text/plain" id="tool-runtime">
(function(){
'use strict';
var M = window.MANIFEST;
var W = 360, H = 360;
var port = null, mode = 'interactive';
var params = {};
M.params.forEach(function(p){ params[p.id] = p.default; });
var input = null, inHistory = null, inHash = null, current = null, targets = [];
var cv, ctx, emptyEl, sendBtn, sel, histEl, timer = null;

function strHash(s){ var h = 2166136261; for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function lum(d, i){ return 0.2126 * d[i] + 0.7152 * d[i+1] + 0.0722 * d[i+2]; }
function uuid(){ try { return crypto.randomUUID(); } catch(e) { return 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, function(){ return (Math.random()*16|0).toString(16); }); } }
async function hashBuf(buf){
  try { var d = await crypto.subtle.digest('SHA-256', buf); return 'sha256-' + Array.from(new Uint8Array(d)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join(''); }
  catch(e){ var u = new Uint8Array(buf), h1 = 0x811c9dc5, h2 = 0x9747b28c; for (var i = 0; i < u.length; i++){ h1 = Math.imul(h1 ^ u[i], 16777619) >>> 0; h2 = Math.imul(h2 ^ u[i], 2246822507) >>> 0; } return 'fnv-' + h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0'); }
}

var PROC = {
  'app.demo.imagine': function(_, p){
    var c = document.createElement('canvas'); c.width = W; c.height = H; var g = c.getContext('2d');
    var text = String(p.prompt || '').toLowerCase();
    var r = rng((strHash(text) ^ (Number(p.seed) >>> 0)) >>> 0);
    var hue = Math.floor(r() * 360);
    var dark = /nacht|dunkel|night|dark/.test(text);
    var bg = g.createLinearGradient(0, 0, W * r(), H);
    bg.addColorStop(0, 'hsl(' + hue + ',' + (55 + r()*25) + '%,' + (dark ? 18 : 72) + '%)');
    bg.addColorStop(1, 'hsl(' + ((hue + 40 + r()*60) % 360) + ',' + (60 + r()*20) + '%,' + (dark ? 8 : 38) + '%)');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    if (/streif|stripe|linie|line/.test(text) || r() < 0.35){
      g.save(); g.translate(W/2, H/2); g.rotate(r() * Math.PI);
      var n = 6 + Math.floor(r() * 10);
      for (var i = -n; i < n; i++){ g.fillStyle = 'hsla(' + ((hue + 180) % 360) + ',70%,' + (dark ? 60 : 90) + '%,' + (0.12 + r()*0.18) + ')'; g.fillRect(i * (W/n), -H, W / (n * 2.2), H * 2); }
      g.restore();
    }
    var count = Math.max(1, Math.round(Number(p.density) || 8));
    var circles = /kreis|circle|blase|bubble/.test(text) ? count + 6 : count;
    for (var k = 0; k < circles; k++){

function applyTheme(t){ if (!t) return; Object.keys(t).forEach(function(k){ if (t[k]) document.documentElement.style.setProperty(k, t[k]); }); document.documentElement.style.setProperty('--c', M.cable); }

    pr.chain.forEach(function(id){ Object.assign(firstOf(id).params, pr.p[id] || {}); });
    setChain(pr.chain); toast('Preset ' + pr.name + ' geladen');
  })); });
}

/* ---------- Eingebundene Tools ---------- */
var TOOL_STORE = 'patchbay.tools.v1', DEFAULT_EXTERNAL = ['/tools/halbton/patchbay.json', '/tools/dsprsn/patchbay.json'];
var PALETTE = ['#0E8C8C', '#D9480F', '#5C7CFA', '#AE3EC9', '#2B8A3E'];
function savedToolUrls(){ try { var a = JSON.parse(localStorage.getItem(TOOL_STORE) || '[]'); return Array.isArray(a) ? a.filter(function(x){ return typeof x === 'string'; }) : []; } catch(e){ return []; } }
function rememberToolUrl(u){
  var def = DEFAULT_EXTERNAL.map(function(x){ return new URL(x, location.href).href; });
  if (def.indexOf(u) >= 0) return;
  var list = savedToolUrls(); if (list.indexOf(u) < 0){ list.push(u); try { localStorage.setItem(TOOL_STORE, JSON.stringify(list)); } catch(e){} }
}
function validManifest(m){
  return m && typeof m.id === 'string' && /^[\w.\-]{3,120}$/.test(m.id) && typeof m.name === 'string' && typeof m.version === 'string' && typeof m.entry === 'string'
    && Array.isArray(m.accepts) && Array.isArray(m.produces) && Array.isArray(m.params) && Array.isArray(m.modes) && m.modes.indexOf('headless') >= 0
    && m.params.every(function(p){ return p && typeof p.id === 'string' && typeof p.type === 'string'; });
}
async function registerFromUrl(url){
  var abs;
  try { abs = new URL(url, location.href).href; } catch(e){ throw new Error('Das ist keine gültige Adresse.'); }
  if (!/^https?:/.test(abs)) throw new Error('Nur http- und https-Adressen sind erlaubt.');
  var res;
  try { res = await fetch(abs, { mode: 'cors', cache: 'no-cache' }); }
  catch(e){ throw new Error('Kein Zugriff auf ' + hostOf(abs) + ': Entweder gibt es dort kein Manifest, oder der Server erlaubt fremden Seiten keinen Zugriff (CORS).'); }
  if (!res.ok) throw new Error('Manifest nicht erreichbar (HTTP ' + res.status + ').');
  var m; try { m = await res.json(); } catch(e){ throw new Error('Die Datei ist kein JSON. Erwartet wird ein Patchbay-Manifest.'); }
  if (!validManifest(m)) throw new Error('Kein gültiges Patchbay-Manifest. Pflicht: id, name, version, entry, accepts, produces, params und modes mit „headless“.');
  if (byId[m.id]) return byId[m.id];
  var entry = new URL(m.entry, abs).href;
  var t = { id: m.id, short: (m.id.split('.').pop() || 'tool').replace(/[^a-z0-9]/gi, '').toLowerCase() || 'tool', name: String(m.name).slice(0, 40), job: String(m.description || '').slice(0, 90), version: String(m.version).slice(0, 20),
    cable: (typeof m.color === 'string' && /^#[0-9a-f]{6}$/i.test(m.color)) ? m.color : PALETTE[TOOLS.length % PALETTE.length],
    accepts: m.accepts, produces: m.produces, modes: m.modes, deterministic: !!m.deterministic, op: m.op === 'generate' ? 'generate' : 'transform',
    repro: ['exact', 'seeded', 'documented', 'opaque'].indexOf(m.repro) >= 0 ? m.repro : (m.deterministic ? 'exact' : 'documented'),
    params: m.params, source: 'url', manifestUrl: abs, entry: entry, origin: new URL(entry).origin };
  TOOLS.push(t); byId[t.id] = t;
  headless[t.id] = makeFrame(t, 'headless', $('frames'));
  return t;
}

function candidatesFor(input){
  var u; try { u = new URL(input, location.href); } catch(e){ return [input]; }
  if (/\.json$/i.test(u.pathname)) return [u.href];
  var dir = u.origin + (u.pathname.endsWith('/') ? u.pathname : u.pathname + '/');
  var list = [dir + 'patchbay.json', u.origin + '/.well-known/patchbay.json'];
  return list.filter(function(x, i){ return list.indexOf(x) === i; });
}
async function resolveTool(input){
  var errs = [];
  var list = candidatesFor(input);
  for (var i = 0; i < list.length; i++){
    try { return await registerFromUrl(list[i]); } catch(e){ errs.push(e.message); }
  }
  var err = new Error(list.length > 1
    ? 'Unter dieser Adresse spricht kein Tool Patchbay: Weder ein Manifest neben der Seite noch unter /.well-known/patchbay.json war lesbar.'
    : errs[0]);
  err.bridgeable = true;
  throw err;
}

/* ---------- Auswertung ---------- */
function setStatus(n, s){ n.status = s; if (!n.statusEl) return; n.statusEl.textContent = s || ' '; n.statusEl.className = 'status' + (s === 'Cache' ? ' cache' : /ms$/.test(s) ? ' live' : ''); }
function drawBuf(cv, o){ cv.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(o.buf), o.w, o.h), 0, 0); }
function clearCv(cv){ cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); }
var timer = null, token = 0;
function schedule(){ clearTimeout(timer); timer = setTimeout(run, 90); save(); }
async function run(){
  var my = ++token, memo = {}, t0 = performance.now(), hits = 0, renders = 0;
  setRunStatus('busy', 'rechnet …');
  async function ev(n){
    if (Object.prototype.hasOwnProperty.call(memo, n.key)) return memo[n.key];
    memo[n.key] = null;
    var res = null;
    if (n.kind === 'output'){
      var so = srcOf(n); res = so ? await ev(so) : null;
      setStatus(n, res ? shortHash(res.hash) : 'nicht verbunden');
    } else if (n.kind === 'bridge'){
      var sb = srcOf(n), inb = sb ? await ev(sb) : null;
      n.inBuf = inb; n.inHash = inb ? inb.hash : null;
      res = n.imported || null;
      setStatus(n, res ? 'übernommen' : (inb ? 'wartet auf Ergebnis' : 'Bild ablegen'));
    } else {
      var input = null, inHash = null;
      if (n.tool.op !== 'generate'){
        var s = srcOf(n);
        if (!s){ setStatus(n, 'kein Eingang'); n.out = null; return null; }
        input = await ev(s);
        if (!input){ setStatus(n, 'wartet auf Eingang'); n.out = null; return null; }
        inHash = input.hash;
      }
      n.inHash = inHash;
      if (n.bypass){ res = input; setStatus(n, 'Bypass'); }
      else {
        var key = n.tool.id + '@' + n.tool.version + '|' + inHash + '|' + JSON.stringify(n.params);
        res = cache.get(key);
        if (res){ hits++; setStatus(n, 'Cache'); }
        else {
          var entry = headless[n.tool.id];
          try { await whenReady(entry); } catch(err){ setStatus(n, 'antwortet nicht'); log('Host', label(n), 'error', err.message); return null; }
          var copy = input ? input.buf.slice(0) : null, r;
          try { r = await request(entry, { pb: 'render', v: '0.1', rid: uid(), input: copy ? { buf: copy, w: input.w, h: input.h } : null, params: clone(n.params) }, copy ? [copy] : []); }
          catch(err){ setStatus(n, 'Fehler'); log('Host', label(n), 'error', err.message); return null; }
          if (r.pb === 'error'){ setStatus(n, 'Fehler'); log(label(n), 'Host', 'error', r.message); return null; }
          res = { buf: r.output.buf, w: r.output.w, h: r.output.h };
          res.hash = await hashBuf(res.buf);
          if (cache.size > 300) cache.delete(cache.keys().next().value);
          cache.set(key, res); renders++;
          var ms = Math.max(1, Math.round(r.ms)) + ' ms';
          setStatus(n, ms); log(label(n), 'Host', 'result', ms + ' · ' + shortHash(res.hash));
        }
      }
    }
    n.out = res; memo[n.key] = res; return res;
  }
  var pipe = nodes.filter(isPipe);
  for (var i = 0; i < pipe.length; i++){ await ev(pipe[i]); if (my !== token) return; }
  pipe.forEach(function(n){ if (n.thumb){ if (n.out) drawBuf(n.thumb, n.out); else clearCv(n.thumb); } });
  if (hits && !renders) log('Host', 'Cache', 'cache', 'Keine Neuberechnung nötig, ' + hits + ' Nodes aus dem Cache');
  var outN = nodeBy('out');
  var items = currentChain().filter(function(n){ return !n.bypass && n.out; }).map(function(n, k){
    var node;
    if (n.kind === 'bridge'){
      node = { id: 'n' + (k + 1), op: 'manual', tool: { id: 'web:' + hostOf(n.url), version: '–', url: n.url }, params: {}, inputs: n.inHash ? [n.inHash] : [], outputs: [n.out.hash], repro: 'opaque', note: 'Außerhalb von Patchbay bearbeitet' };
    } else {
      node = { id: 'n' + (k + 1), op: n.tool.op, tool: { id: n.tool.id, version: n.tool.version }, params: {}, inputs: n.inHash ? [n.inHash] : [], outputs: [n.out.hash], repro: n.tool.repro };
      if (n.tool.source === 'url') node.tool.manifest = n.tool.manifestUrl;
      Object.keys(n.params).forEach(function(q){ if (q !== 'prompt' && q !== 'seed') node.params[q] = n.params[q]; });
      if (n.tool.op === 'generate' && n.tool.source === 'builtin'){ node.prompt = { text: n.params.prompt }; node.model = { name: 'demo-noise-1', note: 'simuliert, kein echtes KI-Modell' }; node.seed = n.params.seed; }
    }
    return { n: n, h: node };
  });
  nodes.forEach(function(n){ if (n.uiFrame || n.fsFrame) sendState(n); });
  if (outN && outN.out){ drawBuf($('out'), outN.out); renderOut(outN.out, items, performance.now() - t0, hits); setRunStatus('ok', Math.round(performance.now() - t0) + ' ms · ' + items.length + ' Schritte · ' + hits + ' aus Cache'); }
  else {
    clearCv($('out')); $('histList').innerHTML = ''; $('pkgJson2').textContent = 'Die Ausgabe ist nicht verbunden.';
    setRunStatus('idle', 'Ausgabe nicht verbunden');
    var meta = $('outMeta'); meta.innerHTML = '';
    var dt = document.createElement('dt'); dt.textContent = 'Status'; var dd = document.createElement('dd'); dd.textContent = 'Nicht verbunden. Zieh ein Kabel zum Node „Ausgabe“.';
    meta.appendChild(dt); meta.appendChild(dd);
  }
}
function setRunStatus(kind, text){ $('sdot').className = 'sdot' + (kind === 'ok' ? '' : ' ' + kind); $('statusTxt').textContent = text; }
function renderOut(o, items, ms, hits){
  var hist = items.map(function(i){ return i.h; });
  var meta = $('outMeta'); meta.innerHTML = '';
  [['Größe', o.w + ' × ' + o.h + ' px, 8 Bit RGBA'], ['Hash', shortHash(o.hash)], ['Kette', items.map(function(i){ return label(i.n); }).join(' → ')], ['Lauf', Math.round(ms) + ' ms, ' + hits + ' aus Cache']].forEach(function(r){
    var dt = document.createElement('dt'); dt.textContent = r[0]; var dd = document.createElement('dd'); dd.textContent = r[1]; meta.appendChild(dt); meta.appendChild(dd);
  });
  var ol = $('histList'); ol.innerHTML = '';
  items.forEach(function(it){
    var n = it.h, li = document.createElement('li');
    var dot = document.createElement('span'); dot.className = 'dot'; dot.style.setProperty('--c', cableOf(it.n));
    var box = document.createElement('div');
    var h1 = document.createElement('div'); h1.className = 'h1'; h1.textContent = n.id + ' · ' + label(it.n) + ' ';
    var rp = document.createElement('span'); rp.className = 'repro ' + n.repro; rp.textContent = n.repro; h1.appendChild(rp);
    var h2 = document.createElement('div'); h2.className = 'h2';
    var bits = [n.op + ' · ' + n.tool.id + (n.tool.version !== '–' ? '@' + n.tool.version : '')];
    if (n.note) bits.push(n.note);
    if (n.prompt) bits.push('Prompt: „' + n.prompt.text + '“ · Seed ' + n.seed);
    var ps = Object.keys(n.params).map(function(k){ return k + '=' + n.params[k]; }).join(', '); if (ps) bits.push(ps);
    bits.push((n.inputs[0] ? shortHash(n.inputs[0]) : 'keine Eingabe') + ' → ' + shortHash(n.outputs[0]));
    bits.forEach(function(b, i){ if (i) h2.appendChild(document.createElement('br')); h2.appendChild(document.createTextNode(b)); });
    box.appendChild(h1); box.appendChild(h2); li.appendChild(dot); li.appendChild(box); ol.appendChild(li);
  });
  var manifest = { patchbay: '0.1', primary: 'a1', assets: [{ id: 'a1', role: 'main', type: 'image/png', width: o.w, height: o.h, bitDepth: 8, colorSpace: 'srgb', alpha: true, hash: o.hash, path: 'assets/a1.png' }], history: { head: hist.length ? hist[hist.length - 1].id : null, nodes: hist } };
  $('pkgJson2').textContent = JSON.stringify(manifest, null, 2);
}

/* ---------- Anordnen, Presets, Ausgangszustand ---------- */
var ROW_Y = 380;
function firstOf(toolId){ return nodes.find(function(n){ return n.tool && n.tool.id === toolId; }) || newNode('tool', byId[toolId], 0, 0); }
function currentChain(){ var outN = nodeBy('out'), ch = []; for (var c = outN ? srcOf(outN) : null; c; c = srcOf(c)) ch.unshift(c); return ch; }
function layout(chain){
  var x = 120, inChain = {};
  chain.forEach(function(n, i){ n.x = x; n.y = ROW_Y + (i % 2 ? 46 : 0); x += n.w + 128; inChain[n.key] = 1; });
  var outN = nodeBy('out'); if (outN){ outN.x = x; outN.y = ROW_Y; inChain.out = 1; }
  var rx = 120, ry = ROW_Y + 720;
  nodes.forEach(function(n){ if (isPipe(n) && !inChain[n.key]){ n.x = rx; n.y = ry; rx += n.w + 128; } });
}
function setChain(ids){
  var gen = firstOf('app.demo.imagine'), outN = nodeBy('out') || newNode('output', null, 0, 0);
  var chain = [gen].concat(ids.map(firstOf));
  edges = [];
  for (var i = 1; i < chain.length; i++) edges.push({ from: chain[i - 1].key, to: chain[i].key });
  edges.push({ from: chain[chain.length - 1].key, to: outN.key });
  chain.forEach(function(n){ n.bypass = false; });
  applyWidths(); layout(chain); buildBoard(); fit(); schedule();
}
function defaults(){
  nodes = []; edges = []; strokes = []; seq = 0;
  var t = newNode('text', null, 120, 110); t.title = DEFAULT_TITLE; t.body = DEFAULT_BODY;
  var g = newNode('tool', byId['app.demo.imagine'], 0, 0), a = newNode('tool', byId['app.demo.posterize'], 0, 0), b = newNode('tool', byId['app.demo.dither'], 0, 0), d = newNode('tool', byId['app.demo.duotone'], 0, 0);
  newNode('output', null, 0, 0);
  applyWidths();
  edges = [{ from: g.key, to: a.key }, { from: a.key, to: b.key }, { from: b.key, to: d.key }, { from: d.key, to: 'out' }];
  layout([g, a, b, d]);
  var n = newNode('note', null, 690, 110); n.text = 'Kabel vom rechten zum linken Anschluss ziehen. Ein Kabel antippen trennt es. Mit dem Stift kannst du direkt aufs Deck schreiben.';
}

/* ---------- Start ---------- */
window.addEventListener('resize', function(){ sizeBoard(); });
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ setTimeout(sendThemeAll, 30); }); } catch(e){}
new MutationObserver(function(){ setTimeout(sendThemeAll, 30); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
function sendThemeAll(){ var t = themeVars(); frames.forEach(function(f){ if (f.port) f.port.postMessage({ pb: 'theme', theme: t }); }); }
(async function start(){
  var defs = DEFAULT_EXTERNAL.map(function(x){ return new URL(x, location.href).href; });
  var urls = defs.concat(savedToolUrls().filter(function(u){ return defs.indexOf(u) < 0; }));
  await Promise.all(urls.map(function(u){ return registerFromUrl(u).catch(function(err){ log('Host', hostOf(u), 'error', 'Tool nicht geladen: ' + err.message); }); }));
  buildMenu();
  if (!load()) defaults();
  applyWidths();
  setSide(!narrow.matches);
  buildBoard();
  restoreBridges();
  requestAnimationFrame(function(){ fit(); });
  await Promise.all(TOOLS.filter(function(t){ return t.source === 'builtin'; }).map(function(t){ return headless[t.id].ready; }));
  run();
})();
})();
