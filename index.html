<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patchbay</title>
<meta name="description" content="Offenes Protokoll für Web-Kreativ-Tools: Bilder mit kompletter Historie in einem Node-Editor verkabeln.">
<meta name="theme-color" content="#E6E9EC">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='9' cy='16' r='6' fill='%232343D0'/%3E%3Ccircle cx='23' cy='16' r='6' fill='%23C63B2B'/%3E%3Cpath d='M9 16 C14 6 18 26 23 16' stroke='%2314181D' stroke-width='2.5' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: Vollflächiges Deck (Punktraster) als Arbeitsfläche, Ausgabe als Panel rechts, schwebende Werkzeugleiste unten. Kabelfarben kennzeichnen Tools. */
:root {
  --bg: #E6E9EC;
  --deck: #EEF0F2;
  --dot: #C3CAD1;
  --panel: #F4F6F7;
  --raised: #FFFFFF;
  --ink: #14181D;
  --muted: #56606B;
  --line: #C6CDD4;
  --accent: #2343D0;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE2FA;
  --cable-1: #C99700;
  --cable-2: #23845A;
  --cable-3: #C63B2B;
  --cable-4: #7A3FB0;
  --good: #23845A;
  --warn: #A86A00;
  --note: #FFF0A6;
  --note-ink: #3A3200;
  --note-edge: #E3CF63;
  --shadow: 0 1px 2px rgba(20,24,29,.06), 0 10px 24px -14px rgba(20,24,29,.35);
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1216; --deck: #12161B; --dot: #2A313A; --panel: #161A20; --raised: #1C2128; --ink: #E3E7EB; --muted: #8E98A3; --line: #2B323B;
    --accent: #8499FF; --accent-ink: #0B0F22; --accent-soft: #232B4F;
    --cable-1: #EDBE2C; --cable-2: #48B583; --cable-3: #E8644F; --cable-4: #AE7BDD; --good: #48B583; --warn: #E0A43A;
    --note: #3D3714; --note-ink: #F6E9A6; --note-edge: #5E5420;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1216; --deck: #12161B; --dot: #2A313A; --panel: #161A20; --raised: #1C2128; --ink: #E3E7EB; --muted: #8E98A3; --line: #2B323B;
  --accent: #8499FF; --accent-ink: #0B0F22; --accent-soft: #232B4F;
  --cable-1: #EDBE2C; --cable-2: #48B583; --cable-3: #E8644F; --cable-4: #AE7BDD; --good: #48B583; --warn: #E0A43A;
  --note: #3D3714; --note-ink: #F6E9A6; --note-edge: #5E5420;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; overflow: hidden; -webkit-text-size-adjust: 100%; }
button:focus-visible, select:focus-visible, input:focus-visible, [contenteditable]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* App-Gerüst */
.app { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; padding-top: env(safe-area-inset-top, 0px); }
.app.no-side { grid-template-columns: minmax(0, 1fr); }
.app.no-side .side { display: none; }
.stage { position: relative; min-width: 0; min-height: 0; }

/* Deck */
.board { position: absolute; inset: 0; overflow: auto; background-color: var(--deck); background-image: radial-gradient(var(--dot) 1px, transparent 1.3px); background-size: 20px 20px; overscroll-behavior: contain; }
.board.panning { cursor: grabbing; }
.sizer { position: relative; }
.plane { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.wires, .ink { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.ink { z-index: 100000; }
.penlayer { position: absolute; inset: 0; z-index: 100001; cursor: crosshair; touch-action: none; }
.wire { fill: none; stroke-width: 3.5; stroke-linecap: round; pointer-events: none; }
.wire.temp { stroke-dasharray: 6 6; }
.wire-hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: pointer; }
.wire-hit:hover + .wire { stroke-width: 5.5; }
.ink-stroke { fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* Nodes */
.node { position: absolute; background: var(--raised); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: var(--r); padding: 0 12px 12px; display: grid; gap: 10px; align-content: start; box-shadow: var(--shadow); }
.node.dragging { box-shadow: 0 2px 4px rgba(0,0,0,.08), 0 22px 40px -16px rgba(0,0,0,.45); }
.node.bypass .params, .node.bypass .thumb { opacity: .5; }
.node.bypass .params { pointer-events: none; }
.handle { display: flex; align-items: center; gap: 8px; padding: 10px 0 2px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.node.dragging .handle { cursor: grabbing; }
.node h3 { margin: 0; font: 700 15px/1.2 var(--font-display); font-stretch: 110%; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .ver { font: 500 11px/1 var(--font-mono); color: var(--muted); }
.node .job { font-size: 12px; color: var(--muted); margin-top: -6px; }
.jack { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 30%, transparent); flex: none; }
.port { position: absolute; top: 14px; width: 18px; height: 18px; border-radius: 50%; background: var(--raised); border: 3px solid var(--c); cursor: crosshair; touch-action: none; z-index: 2; }
.port::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; }
.port.in { left: -10px; }
.port.out { right: -10px; }
.port.on { background: var(--c); }
.port.in.on { border-color: var(--line); background: var(--muted); }
.port:hover { transform: scale(1.2); }
.board.wiring .port.in { box-shadow: 0 0 0 4px var(--accent-soft); }
.delbtn { font: 600 15px/1 var(--font-mono); border: 0; background: transparent; color: var(--muted); width: 24px; height: 24px; border-radius: 6px; cursor: pointer; flex: none; }
.delbtn:hover { background: var(--panel); color: var(--ink); }
.thumb { width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 6px; background: var(--panel); display: block; }
.params { display: grid; gap: 10px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.field label output { font-family: var(--font-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.field input[type="range"] { width: 100%; accent-color: var(--accent); }
.field select, .field input[type="text"], .field input[type="number"] { width: 100%; font: 13px/1.3 var(--font-body); padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
.field input[type="color"] { width: 100%; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 2px; }
.seedrow { display: flex; gap: 6px; }
.seedrow input { flex: 1; min-width: 0; }
.cardfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 500 12px/1 var(--font-mono); color: var(--muted); }
.status { font-variant-numeric: tabular-nums; }
.status.cache { color: var(--warn); }
.status.live { color: var(--good); }
.switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
.switch input { accent-color: var(--accent); }
.btn { font: 600 13px/1 var(--font-body); border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }

/* Text-Node */
.node.textnode { background: transparent; border: 1px dashed transparent; border-top: 1px dashed transparent; box-shadow: none; padding: 0 12px 12px; gap: 6px; }
.node.textnode:hover, .node.textnode:focus-within, .node.textnode.dragging { border-color: var(--line); background: color-mix(in srgb, var(--deck) 70%, transparent); }
.textnode .handle { padding: 6px 0 0; color: var(--muted); font: 500 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; opacity: 0; transition: opacity .15s; }
.textnode:hover .handle, .textnode:focus-within .handle, .textnode.dragging .handle { opacity: 1; }
.grip { width: 18px; height: 10px; background-image: radial-gradient(currentColor 1.2px, transparent 1.4px); background-size: 6px 5px; opacity: .7; }
.tn-eyebrow { font: 500 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tn-title { margin: 0; font-family: var(--font-display); font-stretch: 125%; font-weight: 800; font-size: 44px; line-height: 1.04; letter-spacing: -0.01em; text-wrap: balance; outline-offset: 4px; }
.tn-body { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.5; max-width: 60ch; outline-offset: 4px; }

/* Notiz */
.node.note { background: var(--note); color: var(--note-ink); border: 1px solid var(--note-edge); border-top: 1px solid var(--note-edge); border-radius: 4px 4px 14px 4px; padding: 0 12px 14px; gap: 6px; }
.note .handle { padding: 8px 0 0; font: 600 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.note .handle span:first-of-type { flex: 1; }
.note .delbtn { color: inherit; opacity: .7; }
.note .delbtn:hover { background: color-mix(in srgb, var(--note-ink) 12%, transparent); color: inherit; opacity: 1; }
.note-body { min-height: 96px; font-size: 15px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; outline-offset: 4px; }
.note-body:empty::before { content: attr(data-placeholder); opacity: .55; }

/* Werkzeugleiste */
.dock { position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 4px; padding: 6px; background: var(--raised); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); max-width: calc(100% - 24px); }
.dock .sep { width: 1px; align-self: stretch; margin: 4px 4px; background: var(--line); }
.tbtn { display: inline-flex; align-items: center; gap: 7px; font: 600 13px/1 var(--font-body); color: var(--ink); background: transparent; border: 0; padding: 9px 11px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
.tbtn svg { width: 17px; height: 17px; flex: none; }
.tbtn:hover { background: var(--panel); }
.tbtn[aria-pressed="true"], .tbtn[aria-expanded="true"] { background: var(--accent-soft); }
.tbtn.primary { background: var(--accent); color: var(--accent-ink); }
.tbtn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.tbtn.sq { padding: 9px; }
.zoomval { font: 500 12px/1 var(--font-mono); color: var(--muted); min-width: 48px; text-align: center; border: 0; background: transparent; cursor: pointer; padding: 9px 4px; border-radius: 8px; font-variant-numeric: tabular-nums; }
.zoomval:hover { background: var(--panel); color: var(--ink); }
.penopts { display: flex; align-items: center; gap: 4px; padding-left: 4px; }
.swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--raised); box-shadow: 0 0 0 1px var(--line); background: var(--sw); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.menuwrap { position: relative; }
.menu { position: absolute; left: 0; bottom: calc(100% + 10px); width: 300px; max-height: min(70vh, 520px); overflow: auto; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 8px; display: grid; gap: 2px; }
.menu h4 { margin: 8px 8px 4px; font: 500 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.menu button { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 2px 10px; align-items: center; text-align: left; font: 600 14px/1.25 var(--font-body); color: var(--ink); background: transparent; border: 0; padding: 9px 8px; border-radius: 8px; cursor: pointer; }
.menu button:hover { background: var(--panel); }
.menu button small { grid-column: 2; font-weight: 400; font-size: 12px; color: var(--muted); }
.menu button.plain { grid-template-columns: minmax(0, 1fr); font-weight: 500; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; width: auto; }

/* Ausgabe-Panel */
.side { background: var(--raised); border-left: 1px solid var(--line); overflow: auto; display: flex; flex-direction: column; gap: 14px; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); min-width: 0; }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.side-head h2 { margin: 0; font: 700 18px/1.2 var(--font-display); font-stretch: 115%; }
.side-head .tag { font: 500 11px/1 var(--font-mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
#out { width: 100%; max-width: 100%; aspect-ratio: 1; border-radius: 8px; background: var(--panel); display: block; flex: none; }
.meta { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-family: var(--font-mono); font-size: 12px; margin: 0; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.itabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding-bottom: 8px; flex-wrap: wrap; }
.itabs button { font: 600 13px/1 var(--font-body); background: transparent; color: var(--muted); border: 0; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
.itabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); }
.ipanel { min-width: 0; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-family: var(--font-mono); font-size: 12px; }
.log li { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 8px; padding: 6px 2px; border-bottom: 1px dashed var(--line); }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; }
.log .msg { min-width: 0; overflow-wrap: anywhere; }
.chip { display: inline-block; font: 600 11px/1 var(--font-mono); padding: 3px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--ink); margin-right: 6px; }
.chip.k-result { background: color-mix(in srgb, var(--good) 22%, transparent); }
.chip.k-error { background: color-mix(in srgb, var(--cable-3) 25%, transparent); }
.chip.k-cache { background: color-mix(in srgb, var(--warn) 25%, transparent); }
.route { color: var(--muted); }
pre.json { font-family: var(--font-mono); font-size: 12px; line-height: 1.5; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 0; overflow: auto; white-space: pre; max-height: 60vh; }
.hist { list-style: none; margin: 0; padding: 0; display: grid; }
.hist li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; position: relative; padding-bottom: 14px; }
.hist li:not(:last-child)::after { content: ""; position: absolute; left: 8px; top: 16px; bottom: 0; width: 2px; background: var(--line); }
.hist .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--c); border: 3px solid var(--raised); box-shadow: 0 0 0 1px var(--line); }
.hist .h1 { font-weight: 600; font-size: 14px; }
.hist .h2 { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.repro { font: 600 11px/1 var(--font-mono); padding: 3px 6px; border-radius: 4px; margin-left: 6px; background: var(--accent-soft); }
.repro.exact { background: color-mix(in srgb, var(--good) 22%, transparent); }
.repro.seeded { background: color-mix(in srgb, var(--warn) 22%, transparent); }
.empty { color: var(--muted); font-size: 13px; margin: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.hidden-frames { position: absolute; width: 1px; height: 1px; overflow: hidden; left: -9999px; top: 0; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); font-size: 13px; padding: 10px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); z-index: 300000; }
.toast.show { opacity: 1; }

body.dragging-any iframe { pointer-events: none; }
.toolui { display: block; width: 100%; height: 360px; border: 0; border-radius: 6px; background: transparent; }
.tag-ext { font: 500 10px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; flex: none; }
.menu form { display: grid; gap: 6px; padding: 2px 8px 8px; }
.menu input[type="url"] { font: 12px/1.3 var(--font-mono); padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); width: 100%; min-width: 0; }
.menu .err { font-size: 12px; color: var(--cable-3); margin: 0; }
.menu form .btn { justify-self: start; }
.menu small { overflow-wrap: anywhere; }
.node.bridge { border-top-style: dashed; }
.bridge .drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 6px; justify-items: center; text-align: center; font-size: 12px; color: var(--muted); }
.bridge .drop:focus-visible, .bridge .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); outline: none; }
.bridge .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.bridge .acts .btn { font-size: 12px; padding: 7px 9px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.field.check label { justify-content: flex-start; color: var(--ink); }
.field.check input { accent-color: var(--accent); }
@media (max-width: 820px) {
  .app, .app.no-side { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; right: 0; bottom: 0; height: 72vh; z-index: 200000; border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -20px 40px -20px rgba(0,0,0,.4); }
  .tbtn .lbl { display: none; }
  .tbtn { padding: 9px; }
  .zoomval { min-width: 42px; }
  .menu { position: fixed; left: 12px; right: 12px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: auto; }
}
@media (prefers-reduced-motion: reduce) { .toast, .textnode .handle { transition: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <main class="stage">
    <div class="board" id="board" aria-label="Deck">
      <div class="sizer" id="sizer">
        <div class="plane" id="plane">
          <svg class="wires" id="wires" aria-hidden="true"></svg>
          <svg class="ink" id="ink" aria-hidden="true"></svg>
          <div class="penlayer" id="penLayer" hidden></div>
        </div>
      </div>
    </div>
    <nav class="dock" role="toolbar" aria-label="Werkzeuge">
      <div class="menuwrap" id="menuWrap">
        <button class="tbtn primary" id="toolBtn" aria-haspopup="true" aria-expanded="false" aria-controls="toolMenu" title="Neues Tool">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Neues Tool</span>
        </button>
        <div class="menu" id="toolMenu" role="menu" hidden></div>
      </div>
      <button class="tbtn" id="noteBtn" title="Notiz hinzufügen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 4h14v11l-5 5H5z"/><path d="M14 20v-5h5"/></svg><span class="lbl">Notiz</span>
      </button>
      <button class="tbtn" id="penBtn" aria-pressed="false" title="Stift: direkt aufs Deck zeichnen (Esc beendet)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 7l3 3"/></svg><span class="lbl">Stift</span>
      </button>
      <div class="penopts" id="penOpts" hidden>
        <button class="swatch" data-color="--ink" aria-pressed="true" aria-label="Farbe Tinte" style="--sw: var(--ink)"></button>
        <button class="swatch" data-color="--accent" aria-pressed="false" aria-label="Farbe Blau" style="--sw: var(--accent)"></button>
        <button class="swatch" data-color="--cable-3" aria-pressed="false" aria-label="Farbe Rot" style="--sw: var(--cable-3)"></button>
        <button class="tbtn sq" id="undoBtn" title="Letzten Strich entfernen" aria-label="Letzten Strich entfernen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>
        </button>
        <button class="tbtn" id="clearBtn" title="Alle Striche löschen"><span>Leeren</span></button>

      <button class="tbtn" id="uiBtn" aria-pressed="false" title="Tool-Oberflächen: einheitlich aus dem Schema oder original vom Tool">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg><span class="lbl" id="uiLbl">UI: Einheitlich</span>

<script type="text/plain" id="tool-css">
:root{--bg:#fff;--panel:#f4f6f7;--raised:#fff;--ink:#14181d;--muted:#56606b;--line:#c6cdd4;--accent:#2343d0;--accent-ink:#fff;--c:#c99700}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--raised);color:var(--ink);font:14px/1.45 var(--font-body,system-ui,sans-serif)}
.app{padding:14px 16px 18px;display:grid;gap:12px;max-width:520px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.jack{width:12px;height:12px;border-radius:50%;background:var(--c)}
h1{font:800 18px/1.1 var(--font-display,system-ui,sans-serif);font-stretch:118%;margin:0}
.ver{font:500 11px/1 var(--font-mono,monospace);color:var(--muted)}
.pb{margin-left:auto;font:600 11px/1 var(--font-mono,monospace);padding:4px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.job{color:var(--muted);font-size:13px;margin-top:-6px}
.stage{position:relative;background:var(--panel);border-radius:8px;overflow:hidden;aspect-ratio:1;max-width:100%}
canvas{display:block;width:100%;height:100%}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);font-size:13px}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.f{display:grid;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
label output{font-family:var(--font-mono,monospace);color:var(--ink)}
input,select{font:13px/1.3 var(--font-body,system-ui,sans-serif);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%;min-width:0}
input[type=range]{padding:0;accent-color:var(--accent);background:transparent;border:0}
input[type=color]{height:32px;padding:2px}
.seed{display:flex;gap:6px}
button{font:600 13px/1 var(--font-body,system-ui,sans-serif);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.send{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.send label{font-size:13px;color:var(--ink)}
.hist{font:12px/1.4 var(--font-mono,monospace);color:var(--muted)}
.hist b{color:var(--ink);font-weight:600}
</script>

<script type="text/plain" id="tool-runtime">
(function(){
'use strict';
var M = window.MANIFEST;
var W = 360, H = 360;
var port = null, mode = 'interactive';
var params = {};
M.params.forEach(function(p){ params[p.id] = p.default; });
var input = null, inHistory = null, inHash = null, current = null, targets = [];
var cv, ctx, emptyEl, sendBtn, sel, histEl, timer = null;

function strHash(s){ var h = 2166136261; for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function lum(d, i){ return 0.2126 * d[i] + 0.7152 * d[i+1] + 0.0722 * d[i+2]; }
function uuid(){ try { return crypto.randomUUID(); } catch(e) { return 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, function(){ return (Math.random()*16|0).toString(16); }); } }
async function hashBuf(buf){
  try { var d = await crypto.subtle.digest('SHA-256', buf); return 'sha256-' + Array.from(new Uint8Array(d)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join(''); }
  catch(e){ var u = new Uint8Array(buf), h1 = 0x811c9dc5, h2 = 0x9747b28c; for (var i = 0; i < u.length; i++){ h1 = Math.imul(h1 ^ u[i], 16777619) >>> 0; h2 = Math.imul(h2 ^ u[i], 2246822507) >>> 0; } return 'fnv-' + h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0'); }
}

var PROC = {
  'app.demo.imagine': function(_, p){
    var c = document.createElement('canvas'); c.width = W; c.height = H; var g = c.getContext('2d');
    var text = String(p.prompt || '').toLowerCase();
    var r = rng((strHash(text) ^ (Number(p.seed) >>> 0)) >>> 0);
    var hue = Math.floor(r() * 360);
    var dark = /nacht|dunkel|night|dark/.test(text);
    var bg = g.createLinearGradient(0, 0, W * r(), H);
    bg.addColorStop(0, 'hsl(' + hue + ',' + (55 + r()*25) + '%,' + (dark ? 18 : 72) + '%)');
    bg.addColorStop(1, 'hsl(' + ((hue + 40 + r()*60) % 360) + ',' + (60 + r()*20) + '%,' + (dark ? 8 : 38) + '%)');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    if (/streif|stripe|linie|line/.test(text) || r() < 0.35){
      g.save(); g.translate(W/2, H/2); g.rotate(r() * Math.PI);
      var n = 6 + Math.floor(r() * 10);
      for (var i = -n; i < n; i++){ g.fillStyle = 'hsla(' + ((hue + 180) % 360) + ',70%,' + (dark ? 60 : 90) + '%,' + (0.12 + r()*0.18) + ')'; g.fillRect(i * (W/n), -H, W / (n * 2.2), H * 2); }
      g.restore();
    }
    var count = Math.max(1, Math.round(Number(p.density) || 8));
    var circles = /kreis|circle|blase|bubble/.test(text) ? count + 6 : count;
    for (var k = 0; k < circles; k++){
      var x = r() * W, y = r() * H, rad = 12 + r() * (W / 3.2);
      var h2 = (hue + r()*140 - 40 + 360) % 360;
      var gr = g.createRadialGradient(x - rad*0.3, y - rad*0.3, rad*0.1, x, y, rad);
      gr.addColorStop(0, 'hsla(' + h2 + ',85%,' + (dark ? 70 : 80) + '%,0.95)');
      gr.addColorStop(1, 'hsla(' + ((h2 + 30) % 360) + ',75%,' + (dark ? 25 : 35) + '%,0.85)');
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill();
    }
    var fx = W * (0.3 + r()*0.4), fy = H * (0.3 + r()*0.4), fr = W * (0.18 + r()*0.12);
    g.fillStyle = 'hsl(' + ((hue + 200) % 360) + ',70%,' + (dark ? 55 : 45) + '%)';
    g.beginPath(); g.arc(fx, fy, fr, 0, Math.PI * 2); g.fill();
    return g.getImageData(0, 0, W, H);
  },
  'app.demo.posterize': function(img, p){
    var L = Math.max(2, Math.round(p.levels)), c = Number(p.contrast) * 2.55;
    var f = (259 * (c + 255)) / (255 * (259 - c)), step = 255 / (L - 1);
    var s = img.data, out = new ImageData(img.width, img.height), d = out.data;
    for (var i = 0; i < s.length; i += 4){
      for (var k = 0; k < 3; k++){ var v = f * (s[i+k] - 128) + 128; v = v < 0 ? 0 : v > 255 ? 255 : v; d[i+k] = Math.round(v / step) * step; }
      d[i+3] = 255;
    }
    return out;
  },
  'app.demo.dither': function(img, p){
    var sc = Math.max(1, Math.round(p.scale)), w = img.width, h = img.height;
    var w2 = Math.ceil(w / sc), h2 = Math.ceil(h / sc), a = new Float32Array(w2 * h2), s = img.data, x, y;
    for (y = 0; y < h2; y++) for (x = 0; x < w2; x++){
      var sum = 0, n = 0;
      for (var yy = y*sc; yy < Math.min(h, (y+1)*sc); yy++) for (var xx = x*sc; xx < Math.min(w, (x+1)*sc); xx++){ sum += lum(s, (yy*w + xx) * 4); n++; }
      a[y*w2 + x] = sum / n;
    }
    var alg = p.algorithm;
    if (alg === 'bayer'){
      var B = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
      for (y = 0; y < h2; y++) for (x = 0; x < w2; x++){ var t = (B[(y % 4) * 4 + (x % 4)] + 0.5) * 16; a[y*w2 + x] = a[y*w2 + x] > t ? 255 : 0; }
    } else {
      var add = function(px, py, e){ if (px >= 0 && px < w2 && py < h2) a[py*w2 + px] += e; };
      for (y = 0; y < h2; y++) for (x = 0; x < w2; x++){
        var i = y*w2 + x, o = a[i], nv = o < 128 ? 0 : 255, e = o - nv; a[i] = nv;
        if (alg === 'atkinson'){ var q = e / 8; add(x+1,y,q); add(x+2,y,q); add(x-1,y+1,q); add(x,y+1,q); add(x+1,y+1,q); add(x,y+2,q); }
        else { add(x+1,y,e*7/16); add(x-1,y+1,e*3/16); add(x,y+1,e*5/16); add(x+1,y+1,e/16); }
      }
    }
    var out = new ImageData(w, h), d = out.data;
    for (y = 0; y < h; y++) for (x = 0; x < w; x++){ var v = a[Math.floor(y/sc)*w2 + Math.floor(x/sc)], j = (y*w + x) * 4; d[j] = d[j+1] = d[j+2] = v; d[j+3] = 255; }
    return out;
  },
  'app.demo.duotone': function(img, p){
    var hx = function(c){ var n = parseInt(String(c).slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
    var A = hx(p.dark), Bc = hx(p.light), s = img.data, out = new ImageData(img.width, img.height), d = out.data;
    for (var i = 0; i < s.length; i += 4){ var t = lum(s, i) / 255; d[i] = A[0] + (Bc[0]-A[0])*t; d[i+1] = A[1] + (Bc[1]-A[1])*t; d[i+2] = A[2] + (Bc[2]-A[2])*t; d[i+3] = 255; }
    return out;
  }
};

function applyTheme(t){ if (!t) return; Object.keys(t).forEach(function(k){ if (t[k]) document.documentElement.style.setProperty(k, t[k]); }); document.documentElement.style.setProperty('--c', M.cable); }

function el(tag, attrs, kids){ var e = document.createElement(tag); if (attrs) Object.keys(attrs).forEach(function(k){ if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }); (kids || []).forEach(function(c){ e.appendChild(c); }); return e; }

function buildUI(embedded){
  var app = el('div', {class:'app'});
  app.appendChild(el('header', null, [el('span', {class:'jack'}), el('h1', {text:M.name}), el('span', {class:'ver', text:'v' + M.version}), el('span', {class:'pb', text:'Patchbay 0.1'})]));
  app.appendChild(el('div', {class:'job', text:M.job}));
  var stage = el('div', {class:'stage'});
  cv = el('canvas', {width:W, height:H, 'aria-label':'Arbeitsfläche'}); ctx = cv.getContext('2d');
  emptyEl = el('div', {class:'empty', text:'Noch kein Bild. Schick eins aus einem anderen Tool hierher.'});
  stage.appendChild(cv); stage.appendChild(emptyEl); app.appendChild(stage);
  var form = el('form'); form.addEventListener('submit', function(e){ e.preventDefault(); });
  M.params.forEach(function(p){
    var id = 'p-' + p.id, f = el('div', {class:'f' + (p.type === 'prompt' ? ' wide' : '')}), lab = el('label', {for:id, text:p.label}), ctl;
    if (p.type === 'int' || p.type === 'number'){
      var o = el('output', {text:String(params[p.id])}); lab.appendChild(o);
      ctl = el('input', {id:id, type:'range', min:p.min, max:p.max, step:p.step || 1}); ctl.value = params[p.id];
      ctl.addEventListener('input', function(){ params[p.id] = Number(ctl.value); o.textContent = ctl.value; changed(); });
      f.appendChild(lab); f.appendChild(ctl);
    } else if (p.type === 'enum'){
      ctl = el('select', {id:id}); p.options.forEach(function(op){ var oe = el('option', {value:op, text:(p.labels && p.labels[op]) || op}); ctl.appendChild(oe); }); ctl.value = params[p.id];
      ctl.addEventListener('change', function(){ params[p.id] = ctl.value; changed(); });
      f.appendChild(lab); f.appendChild(ctl);
    } else if (p.type === 'color'){
      ctl = el('input', {id:id, type:'color'}); ctl.value = params[p.id];
      ctl.addEventListener('input', function(){ params[p.id] = ctl.value; changed(); });
      f.appendChild(lab); f.appendChild(ctl);
    } else if (p.type === 'seed'){
      ctl = el('input', {id:id, type:'number', min:0, step:1}); ctl.value = params[p.id];
      var dice = el('button', {type:'button', text:'Zufall'});
      ctl.addEventListener('input', function(){ params[p.id] = Number(ctl.value) || 0; changed(); });
      dice.addEventListener('click', function(){ ctl.value = Math.floor(Math.random() * 999999); params[p.id] = Number(ctl.value); changed(); });
      f.appendChild(lab); f.appendChild(el('div', {class:'seed'}, [ctl, dice]));
    } else {
      ctl = el('input', {id:id, type:'text'}); ctl.value = params[p.id];
      ctl.addEventListener('input', function(){ params[p.id] = ctl.value; changed(); });
      f.appendChild(lab); f.appendChild(ctl);
    }
    form.appendChild(f);
  });
  app.appendChild(form);
  if (!embedded){ histEl = el('div', {class:'hist'}); app.appendChild(histEl); renderHist(); }
  if (embedded){ emptyEl.textContent = 'Wartet auf Eingang.'; document.body.appendChild(app); return; }
  sel = el('select', {id:'target', 'aria-label':'Ziel-Tool'});
  sendBtn = el('button', {type:'button', class:'primary', text:'Senden'}); sendBtn.disabled = true;
  sendBtn.addEventListener('click', send);
  app.appendChild(el('div', {class:'send'}, [el('label', {for:'target', text:'Senden an'}), sel, sendBtn]));
  document.body.appendChild(app);
}

function renderHist(){
  if (!histEl) return;
  var n = inHistory ? inHistory.nodes.length : 0;
  histEl.innerHTML = '';
  var b = document.createElement('b'); b.textContent = n + (n === 1 ? ' Schritt' : ' Schritte');
  histEl.appendChild(document.createTextNode('Mitgebrachte Historie: ')); histEl.appendChild(b);
  if (n){ histEl.appendChild(document.createTextNode(' · ' + inHistory.nodes.map(function(x){ return x.tool.id.split('.').pop(); }).join(' → '))); }
}

function fillTargets(){
  if (!sel) return; var prev = sel.value; sel.innerHTML = '';
  targets.forEach(function(t){ sel.appendChild(el('option', {value:t.id, text:t.name})); });
  if (targets.some(function(t){ return t.id === prev; })) sel.value = prev;
  else if (targets.length){ var idx = targets.findIndex(function(t){ return t.next; }); sel.value = targets[idx >= 0 ? idx : 0].id; }
  sendBtn.disabled = !current || !targets.length;
}

function schedule(){ clearTimeout(timer); timer = setTimeout(renderInteractive, 60); }
function changed(){ if (mode === 'embedded') port.postMessage({ pb: 'params', v: '0.1', values: params }); else schedule(); }
function reportSize(){ if (port) port.postMessage({ pb: 'size', v: '0.1', h: Math.ceil(document.documentElement.scrollHeight) }); }
function renderInteractive(){
  if (M.op !== 'generate' && !input){ emptyEl.hidden = false; sendBtn.disabled = true; return; }
  emptyEl.hidden = true;
  current = PROC[M.id](input, params); ctx.putImageData(current, 0, 0);
  sendBtn.disabled = !targets.length;
}

async function send(){
  if (!current || !sel.value) return;
  sendBtn.disabled = true;
  var blob = await new Promise(function(res){ cv.toBlob(res, 'image/png'); });
  var buf = await blob.arrayBuffer(); var h = await hashBuf(buf); var time = new Date().toISOString();
  var prior = inHistory ? inHistory.nodes.slice() : [];
  var p = {}; Object.keys(params).forEach(function(k){ if (k !== 'prompt' && k !== 'seed') p[k] = params[k]; });
  var node = { id: 'n' + (prior.length + 1), op: M.op, tool: { id: M.id, version: M.version }, params: p, inputs: inHash ? [inHash] : [], outputs: [h], repro: M.repro, time: time };
  if (M.op === 'generate'){ node.prompt = { text: params.prompt }; node.model = { name: 'demo-noise-1', note: 'simuliert, kein echtes KI-Modell' }; node.seed = params.seed; }
  var manifest = { patchbay: '0.1', id: 'urn:uuid:' + uuid(), created: time, primary: 'a1',
    assets: [{ id: 'a1', role: 'main', type: 'image/png', width: W, height: H, bitDepth: 8, colorSpace: 'srgb', alpha: true, hash: h, bytes: buf.byteLength, path: 'assets/a1.png' }],
    history: 'history.json' };
  port.postMessage({ pb: 'send', v: '0.1', to: sel.value, patch: { manifest: manifest, history: { head: node.id, nodes: prior.concat([node]) }, assets: { a1: buf } } }, [buf]);
  setTimeout(function(){ sendBtn.disabled = false; }, 400);
}

async function onMsg(d){
  if (!d || !d.pb) return;
  if (d.pb === 'theme') applyTheme(d.theme);
  else if (d.pb === 'state'){
    if (d.output){ ctx.putImageData(new ImageData(new Uint8ClampedArray(d.output.buf), d.output.w, d.output.h), 0, 0); emptyEl.hidden = true; }
    else emptyEl.hidden = false;
  }
  else if (d.pb === 'targets'){ targets = d.list; fillTargets(); }
  else if (d.pb === 'offer'){
    var ok = (d.summary.types || []).every(function(t){ return M.accepts.some(function(a){ return a === t || (a.slice(-2) === '/*' && t.indexOf(a.slice(0, -1)) === 0); }); });
    if (ok && M.accepts.length) port.postMessage({ pb: 'accept', v: '0.1', id: d.id });
    else port.postMessage({ pb: 'reject', v: '0.1', id: d.id, reason: 'Typ wird nicht angenommen' });
  }
  else if (d.pb === 'deliver'){
    var pk = d.patch, a = pk.manifest.assets.find(function(x){ return x.id === pk.manifest.primary; });
    var bmp = await createImageBitmap(new Blob([pk.assets[a.id]], { type: a.type }));
    var c = document.createElement('canvas'); c.width = W; c.height = H; var g = c.getContext('2d'); g.drawImage(bmp, 0, 0, W, H);
    input = g.getImageData(0, 0, W, H); inHistory = pk.history; inHash = a.hash;
    renderHist(); renderInteractive();
    port.postMessage({ pb: 'ack', v: '0.1', id: d.id, hash: a.hash });
  }
  else if (d.pb === 'render'){
    var t0 = performance.now();
    try {
      var inp = d.input ? new ImageData(new Uint8ClampedArray(d.input.buf), d.input.w, d.input.h) : null;
      var out = PROC[M.id](inp, d.params), b = out.data.buffer;
      port.postMessage({ pb: 'result', v: '0.1', rid: d.rid, output: { buf: b, w: out.width, h: out.height }, ms: performance.now() - t0 }, [b]);
    } catch(err){ port.postMessage({ pb: 'error', v: '0.1', rid: d.rid, message: String(err) }); }
  }
}

window.addEventListener('message', function(e){
  if (e.source !== parent) return;
  var d = e.data; if (!d || d.pb !== 'init' || port) return;
  port = e.ports[0]; mode = d.mode; applyTheme(d.theme);
  port.onmessage = function(ev){ onMsg(ev.data); };
  if (mode === 'interactive'){ buildUI(false); renderInteractive(); }
  else if (mode === 'embedded'){
    if (d.params) Object.keys(d.params).forEach(function(k){ params[k] = d.params[k]; });
    buildUI(true);
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(reportSize).observe(document.documentElement);
    reportSize();
  }
});
parent.postMessage({ pb: 'hello', v: '0.1', tool: { id: M.id, version: M.version }, accepts: M.accepts, produces: M.produces }, '*');
})();

/* ---------- Größe, Zoom, Verschieben ---------- */

  var d = 'M' + p[0][0] + ' ' + p[0][1];

  menu.appendChild(document.createElement('hr'));
  menu.appendChild(menuItem('Kette anordnen', 'Verbundene Nodes in eine Reihe legen', null, function(){ applyWidths(); layout(currentChain()); buildBoard(); fit(); save(); }));
  menu.appendChild(menuItem('Deck zurücksetzen', 'Ausgangszustand, Notizen und Striche entfernen', null, function(){ try { localStorage.removeItem(STORE); } catch(e){} defaults(); buildBoard(); fit(); schedule(); toast('Deck zurückgesetzt'); }));
}

/* ---------- Eingebundene Tools ---------- */
var TOOL_STORE = 'patchbay.tools.v1', DEFAULT_EXTERNAL = ['/tools/halbton/patchbay.json'];
var PALETTE = ['#0E8C8C', '#D9480F', '#5C7CFA', '#AE3EC9', '#2B8A3E'];
function savedToolUrls(){ try { var a = JSON.parse(localStorage.getItem(TOOL_STORE) || '[]'); return Array.isArray(a) ? a.filter(function(x){ return typeof x === 'string'; }) : []; } catch(e){ return []; } }
function rememberToolUrl(u){
  var def = DEFAULT_EXTERNAL.map(function(x){ return new URL(x, location.href).href; });
  if (def.indexOf(u) >= 0) return;
  var list = savedToolUrls(); if (list.indexOf(u) < 0){ list.push(u); try { localStorage.setItem(TOOL_STORE, JSON.stringify(list)); } catch(e){} }
}
function validManifest(m){
  return m && typeof m.id === 'string' && /^[\w.\-]{3,120}$/.test(m.id) && typeof m.name === 'string' && typeof m.version === 'string' && typeof m.entry === 'string'
    && Array.isArray(m.accepts) && Array.isArray(m.produces) && Array.isArray(m.params) && Array.isArray(m.modes) && m.modes.indexOf('headless') >= 0
    && m.params.every(function(p){ return p && typeof p.id === 'string' && typeof p.type === 'string'; });
}
async function registerFromUrl(url){
  var abs;
  try { abs = new URL(url, location.href).href; } catch(e){ throw new Error('Das ist keine gültige Adresse.'); }
  if (!/^https?:/.test(abs)) throw new Error('Nur http- und https-Adressen sind erlaubt.');
  var res;
  try { res = await fetch(abs, { mode: 'cors', cache: 'no-cache' }); }
  catch(e){ throw new Error('Kein Zugriff auf ' + hostOf(abs) + ': Entweder gibt es dort kein Manifest, oder der Server erlaubt fremden Seiten keinen Zugriff (CORS).'); }
  if (!res.ok) throw new Error('Manifest nicht erreichbar (HTTP ' + res.status + ').');
  var m; try { m = await res.json(); } catch(e){ throw new Error('Die Datei ist kein JSON. Erwartet wird ein Patchbay-Manifest.'); }
  if (!validManifest(m)) throw new Error('Kein gültiges Patchbay-Manifest. Pflicht: id, name, version, entry, accepts, produces, params und modes mit „headless“.');
  if (byId[m.id]) return byId[m.id];
  var entry = new URL(m.entry, abs).href;
  var t = { id: m.id, short: (m.id.split('.').pop() || 'tool').replace(/[^a-z0-9]/gi, '').toLowerCase() || 'tool', name: String(m.name).slice(0, 40), job: String(m.description || '').slice(0, 90), version: String(m.version).slice(0, 20),
    cable: (typeof m.color === 'string' && /^#[0-9a-f]{6}$/i.test(m.color)) ? m.color : PALETTE[TOOLS.length % PALETTE.length],
    accepts: m.accepts, produces: m.produces, modes: m.modes, deterministic: !!m.deterministic, op: m.op === 'generate' ? 'generate' : 'transform',
    repro: ['exact', 'seeded', 'documented', 'opaque'].indexOf(m.repro) >= 0 ? m.repro : (m.deterministic ? 'exact' : 'documented'),
    params: m.params, source: 'url', manifestUrl: abs, entry: entry, origin: new URL(entry).origin };
  TOOLS.push(t); byId[t.id] = t;
  headless[t.id] = makeFrame(t, 'headless', $('frames'));
  return t;
}

function candidatesFor(input){
  var u; try { u = new URL(input, location.href); } catch(e){ return [input]; }
  if (/\.json$/i.test(u.pathname)) return [u.href];
  var dir = u.origin + (u.pathname.endsWith('/') ? u.pathname : u.pathname + '/');
  var list = [dir + 'patchbay.json', u.origin + '/.well-known/patchbay.json'];
  return list.filter(function(x, i){ return list.indexOf(x) === i; });
}
async function resolveTool(input){
  var errs = [];
  var list = candidatesFor(input);
  for (var i = 0; i < list.length; i++){
    try { return await registerFromUrl(list[i]); } catch(e){ errs.push(e.message); }
  }
  var err = new Error(list.length > 1
    ? 'Unter dieser Adresse spricht kein Tool Patchbay: Weder ein Manifest neben der Seite noch unter /.well-known/patchbay.json war lesbar.'
    : errs[0]);
  err.bridgeable = true;
  throw err;
}

/* ---------- UI-Modus ---------- */
function applyUiBtn(){
  $('uiBtn').setAttribute('aria-pressed', uiMode === 'original' ? 'true' : 'false');
  $('uiLbl').textContent = uiMode === 'original' ? 'UI: Original' : 'UI: Einheitlich';
}
$('uiBtn').addEventListener('click', function(){
  uiMode = uiMode === 'original' ? 'uniform' : 'original';
  try { localStorage.setItem('patchbay.ui', uiMode); } catch(e){}
  applyUiBtn(); applyWidths(); layout(currentChain()); buildBoard(); fit(); schedule();
  toast(uiMode === 'original' ? 'Original: Jedes Tool zeigt seine eigene Oberfläche' : 'Einheitlich: Regler aus dem Parameter-Schema');
});
applyUiBtn();

$('noteBtn').addEventListener('click', function(){ addNode('note', null); });

/* ---------- Panel ---------- */
function setSide(open){
  app.classList.toggle('no-side', !open);
  $('panelBtn').setAttribute('aria-pressed', open ? 'true' : 'false');
  requestAnimationFrame(sizeBoard);
}
$('panelBtn').addEventListener('click', function(){ setSide(app.classList.contains('no-side')); });
$('sideClose').addEventListener('click', function(){ setSide(false); });
document.querySelectorAll('.itabs').forEach(function(bar){
  var btns = bar.querySelectorAll('button');
  btns.forEach(function(b){ b.addEventListener('click', function(){ btns.forEach(function(x){ var on = x === b; x.setAttribute('aria-selected', on ? 'true' : 'false'); $(x.dataset.panel).hidden = !on; }); }); });
});
$('copy2').addEventListener('click', function(){
  var pre = $('pkgJson2');
  navigator.clipboard.writeText(pre.textContent).then(function(){ toast('Manifest kopiert'); }).catch(function(){ var r = document.createRange(); r.selectNodeContents(pre); var s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Text markiert, jetzt kopieren'); });
});

/* ---------- Auswertung ---------- */
function setStatus(n, s){ n.status = s; if (!n.statusEl) return; n.statusEl.textContent = s || ' '; n.statusEl.className = 'status' + (s === 'Cache' ? ' cache' : /ms$/.test(s) ? ' live' : ''); }
function drawBuf(cv, o){ cv.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(o.buf), o.w, o.h), 0, 0); }
function clearCv(cv){ cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); }
var timer = null, token = 0;
function schedule(){ clearTimeout(timer); timer = setTimeout(run, 90); save(); }
async function run(){
  var my = ++token, memo = {}, t0 = performance.now(), hits = 0, renders = 0;
  async function ev(n){
    if (Object.prototype.hasOwnProperty.call(memo, n.key)) return memo[n.key];
    memo[n.key] = null;
    var res = null;
    if (n.kind === 'output'){
      var so = srcOf(n); res = so ? await ev(so) : null;
      setStatus(n, res ? shortHash(res.hash) : 'nicht verbunden');
    } else if (n.kind === 'bridge'){
      var sb = srcOf(n), inb = sb ? await ev(sb) : null;
      n.inBuf = inb; n.inHash = inb ? inb.hash : null;
      res = n.imported || null;
      setStatus(n, res ? 'übernommen' : (inb ? 'wartet auf Ergebnis' : 'Bild ablegen'));
    } else {
      var input = null, inHash = null;
      if (n.tool.op !== 'generate'){
        var s = srcOf(n);
        if (!s){ setStatus(n, 'kein Eingang'); n.out = null; return null; }
        input = await ev(s);
        if (!input){ setStatus(n, 'wartet auf Eingang'); n.out = null; return null; }
        inHash = input.hash;
      }
      n.inHash = inHash;
      if (n.bypass){ res = input; setStatus(n, 'Bypass'); }
      else {
        var key = n.tool.id + '@' + n.tool.version + '|' + inHash + '|' + JSON.stringify(n.params);
        res = cache.get(key);
        if (res){ hits++; setStatus(n, 'Cache'); }
        else {
          var entry = headless[n.tool.id];
          try { await whenReady(entry); } catch(err){ setStatus(n, 'antwortet nicht'); log('Host', label(n), 'error', err.message); return null; }
          var copy = input ? input.buf.slice(0) : null, r;
          try { r = await request(entry, { pb: 'render', v: '0.1', rid: uid(), input: copy ? { buf: copy, w: input.w, h: input.h } : null, params: clone(n.params) }, copy ? [copy] : []); }
          catch(err){ setStatus(n, 'Fehler'); log('Host', label(n), 'error', err.message); return null; }
          if (r.pb === 'error'){ setStatus(n, 'Fehler'); log(label(n), 'Host', 'error', r.message); return null; }
          res = { buf: r.output.buf, w: r.output.w, h: r.output.h };
          res.hash = await hashBuf(res.buf);
          if (cache.size > 300) cache.delete(cache.keys().next().value);
          cache.set(key, res); renders++;
          var ms = Math.max(1, Math.round(r.ms)) + ' ms';
          setStatus(n, ms); log(label(n), 'Host', 'result', ms + ' · ' + shortHash(res.hash));
        }
      }
    }
    n.out = res; memo[n.key] = res; return res;
  }
  var pipe = nodes.filter(isPipe);
  for (var i = 0; i < pipe.length; i++){ await ev(pipe[i]); if (my !== token) return; }
  pipe.forEach(function(n){ if (n.thumb){ if (n.out) drawBuf(n.thumb, n.out); else clearCv(n.thumb); } });
  if (hits && !renders) log('Host', 'Cache', 'cache', 'Keine Neuberechnung nötig, ' + hits + ' Nodes aus dem Cache');
  var outN = nodeBy('out');
  var items = currentChain().filter(function(n){ return !n.bypass && n.out; }).map(function(n, k){
    var node;
    if (n.kind === 'bridge'){
      node = { id: 'n' + (k + 1), op: 'manual', tool: { id: 'web:' + hostOf(n.url), version: '–', url: n.url }, params: {}, inputs: n.inHash ? [n.inHash] : [], outputs: [n.out.hash], repro: 'opaque', note: 'Außerhalb von Patchbay bearbeitet' };
    } else {
      node = { id: 'n' + (k + 1), op: n.tool.op, tool: { id: n.tool.id, version: n.tool.version }, params: {}, inputs: n.inHash ? [n.inHash] : [], outputs: [n.out.hash], repro: n.tool.repro };
      if (n.tool.source === 'url') node.tool.manifest = n.tool.manifestUrl;
      Object.keys(n.params).forEach(function(q){ if (q !== 'prompt' && q !== 'seed') node.params[q] = n.params[q]; });
      if (n.tool.op === 'generate' && n.tool.source === 'builtin'){ node.prompt = { text: n.params.prompt }; node.model = { name: 'demo-noise-1', note: 'simuliert, kein echtes KI-Modell' }; node.seed = n.params.seed; }
    }
    return { n: n, h: node };
  });
  nodes.forEach(function(n){ if (n.uiFrame) sendState(n); });
  if (outN && outN.out){ drawBuf($('out'), outN.out); renderOut(outN.out, items, performance.now() - t0, hits); }
  else {
    clearCv($('out')); $('histList').innerHTML = ''; $('pkgJson2').textContent = 'Die Ausgabe ist nicht verbunden.';
    var meta = $('outMeta'); meta.innerHTML = '';
    var dt = document.createElement('dt'); dt.textContent = 'Status'; var dd = document.createElement('dd'); dd.textContent = 'Nicht verbunden. Zieh ein Kabel zum Node „Ausgabe“.';
    meta.appendChild(dt); meta.appendChild(dd);
  }
}
function renderOut(o, items, ms, hits){
  var hist = items.map(function(i){ return i.h; });
  var meta = $('outMeta'); meta.innerHTML = '';
  [['Größe', o.w + ' × ' + o.h + ' px, 8 Bit RGBA'], ['Hash', shortHash(o.hash)], ['Kette', items.map(function(i){ return label(i.n); }).join(' → ')], ['Lauf', Math.round(ms) + ' ms, ' + hits + ' aus Cache']].forEach(function(r){
    var dt = document.createElement('dt'); dt.textContent = r[0]; var dd = document.createElement('dd'); dd.textContent = r[1]; meta.appendChild(dt); meta.appendChild(dd);
  });
  var ol = $('histList'); ol.innerHTML = '';
  items.forEach(function(it){
    var n = it.h, li = document.createElement('li');
    var dot = document.createElement('span'); dot.className = 'dot'; dot.style.setProperty('--c', cableOf(it.n));
    var box = document.createElement('div');
    var h1 = document.createElement('div'); h1.className = 'h1'; h1.textContent = n.id + ' · ' + label(it.n) + ' ';
    var rp = document.createElement('span'); rp.className = 'repro ' + n.repro; rp.textContent = n.repro; h1.appendChild(rp);
    var h2 = document.createElement('div'); h2.className = 'h2';
    var bits = [n.op + ' · ' + n.tool.id + (n.tool.version !== '–' ? '@' + n.tool.version : '')];
    if (n.note) bits.push(n.note);
    if (n.prompt) bits.push('Prompt: „' + n.prompt.text + '“ · Seed ' + n.seed);
    var ps = Object.keys(n.params).map(function(k){ return k + '=' + n.params[k]; }).join(', '); if (ps) bits.push(ps);
    bits.push((n.inputs[0] ? shortHash(n.inputs[0]) : 'keine Eingabe') + ' → ' + shortHash(n.outputs[0]));
    bits.forEach(function(b, i){ if (i) h2.appendChild(document.createElement('br')); h2.appendChild(document.createTextNode(b)); });
    box.appendChild(h1); box.appendChild(h2); li.appendChild(dot); li.appendChild(box); ol.appendChild(li);
  });
  var manifest = { patchbay: '0.1', primary: 'a1', assets: [{ id: 'a1', role: 'main', type: 'image/png', width: o.w, height: o.h, bitDepth: 8, colorSpace: 'srgb', alpha: true, hash: o.hash, path: 'assets/a1.png' }], history: { head: hist.length ? hist[hist.length - 1].id : null, nodes: hist } };
  $('pkgJson2').textContent = JSON.stringify(manifest, null, 2);
}

/* ---------- Anordnen, Presets, Ausgangszustand ---------- */
var ROW_Y = 340;
function firstOf(toolId){ return nodes.find(function(n){ return n.tool && n.tool.id === toolId; }) || newNode('tool', byId[toolId], 0, 0); }
function currentChain(){ var outN = nodeBy('out'), ch = []; for (var c = outN ? srcOf(outN) : null; c; c = srcOf(c)) ch.unshift(c); return ch; }
function layout(chain){
  var x = 48, inChain = {};
  chain.forEach(function(n, i){ n.x = x; n.y = ROW_Y + (i % 2 ? 46 : 0); x += n.w + 22; inChain[n.key] = 1; });
  var outN = nodeBy('out'); if (outN){ outN.x = x; outN.y = ROW_Y; inChain.out = 1; }
  var rx = 48, ry = ROW_Y + 620;
  nodes.forEach(function(n){ if (isPipe(n) && !inChain[n.key]){ n.x = rx; n.y = ry; rx += n.w + 22; } });
}
function setChain(ids){
  var gen = firstOf('app.demo.imagine'), outN = nodeBy('out') || newNode('output', null, 0, 0);
  var chain = [gen].concat(ids.map(firstOf));
  edges = [];
  for (var i = 1; i < chain.length; i++) edges.push({ from: chain[i - 1].key, to: chain[i].key });
  edges.push({ from: chain[chain.length - 1].key, to: outN.key });
  chain.forEach(function(n){ n.bypass = false; });
  applyWidths(); layout(chain); buildBoard(); fit(); schedule();
}
function defaults(){
  nodes = []; edges = []; strokes = []; seq = 0;
  var t = newNode('text', null, 40, 32); t.title = DEFAULT_TITLE; t.body = DEFAULT_BODY;
  var g = newNode('tool', byId['app.demo.imagine'], 0, 0), a = newNode('tool', byId['app.demo.posterize'], 0, 0), b = newNode('tool', byId['app.demo.dither'], 0, 0), d = newNode('tool', byId['app.demo.duotone'], 0, 0);
  newNode('output', null, 0, 0);
  applyWidths();
  edges = [{ from: g.key, to: a.key }, { from: a.key, to: b.key }, { from: b.key, to: d.key }, { from: d.key, to: 'out' }];
  layout([g, a, b, d]);
  var n = newNode('note', null, 720, 40); n.text = 'Kabel vom rechten zum linken Anschluss ziehen. Ein Kabel antippen trennt es. Mit dem Stift kannst du direkt aufs Deck schreiben.';
}

/* ---------- Start ---------- */
window.addEventListener('resize', function(){ sizeBoard(); });
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ setTimeout(sendThemeAll, 30); }); } catch(e){}
new MutationObserver(function(){ setTimeout(sendThemeAll, 30); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
function sendThemeAll(){ var t = themeVars(); frames.forEach(function(f){ if (f.port) f.port.postMessage({ pb: 'theme', theme: t }); }); }
(async function start(){
  var defs = DEFAULT_EXTERNAL.map(function(x){ return new URL(x, location.href).href; });
  var urls = defs.concat(savedToolUrls().filter(function(u){ return defs.indexOf(u) < 0; }));
  await Promise.all(urls.map(function(u){ return registerFromUrl(u).catch(function(err){ log('Host', hostOf(u), 'error', 'Tool nicht geladen: ' + err.message); }); }));
  buildMenu();
  if (!load()) defaults();
  applyWidths();
  setSide(!narrow.matches);
  buildBoard();
  restoreBridges();
  requestAnimationFrame(function(){ fit(); });
  await Promise.all(TOOLS.filter(function(t){ return t.source === 'builtin'; }).map(function(t){ return headless[t.id].ready; }));
  run();
})();
})();
</script>
